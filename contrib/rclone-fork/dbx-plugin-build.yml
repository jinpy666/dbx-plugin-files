# rclone fork（dbx 分支）→ DBX 插件多架构二进制构建
#
# 用法：将本文件复制到 rclone fork 仓库的 .github/workflows/dbx-plugin-build.yml。
# 产物命名与官方完全一致（rclone-<version>-<os>-<arch>.zip + SHA256SUMS，
# darwin 映射为 osx），使 dbx-plugin-files 侧 scripts/fetch-rclone.sh 只需更新
# RCLONE_VERSION / SHA256 pin / 下载 URL 三处即可切换到 fork。
#
# 平台矩阵（与 dbx-plugin-files 的 5 个发布 target 一一对应）：
#   linux   amd64 + arm64  CGO_ENABLED=0（mount 走纯 Go bazil fuse）
#   windows amd64          CGO_ENABLED=0（mount 运行时加载 WinFsp，编译期无需 CGO）
#   darwin  amd64 + arm64  CGO + macfuse（cmount tag；macos runner 上 clang 交叉双架构）
#
# 保守裁剪：-tags noselfupdate（去 selfupdate）；cross-compile.go 自带
# -trimpath 与 -ldflags "-s -X ...fs.Version=<version>"。
name: Build rclone for DBX plugin

on:
  push:
    branches: ['dbx/**']
    tags: ['dbx-v*']
  workflow_dispatch:
  schedule:
    # 每周一检查上游新版本（见 check-upstream job）；注意 GitHub 会在仓库
    # 60 天无活动后停用 scheduled workflow，需保持仓库活跃。
    - cron: '23 3 * * 1'

permissions:
  contents: read

env:
  # 版本即产物名与 fs.Version：tag 构建用 tag 名（如 dbx-v1.75.1-1），
  # 分支构建用 dbx-<sha> 供联调。
  FORK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dbx-{0}', github.sha) }}

jobs:
  linux:
    name: linux amd64+arm64 (CGO=0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 官方禁用 setup-go 缓存（key 只含 go.sum 时矩阵任务互相覆盖）；
          # fork 构建频率低，不值得额外维护 actions/cache。
          cache: false
      - name: Install doc toolchain
        # make doc 生成 MANUAL.txt/html 与 rclone.1，cross-compile.go 打 zip 时会复制
        run: sudo apt-get update && sudo apt-get install -y pandoc zip
      - name: Build docs
        run: make doc
      - name: Cross-compile linux amd64+arm64
        run: go run bin/cross-compile.go "$FORK_VERSION" -include '^(linux)/(amd64|arm64)$' -tags noselfupdate
      - uses: actions/upload-artifact@v7
        with:
          name: rclone-linux
          if-no-files-found: error
          path: rclone-*.zip

  windows:
    name: windows amd64 (CGO=0)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install doc toolchain
        run: choco install pandoc -y --no-progress
      - name: Build docs
        run: make doc
      # cross-compile.go 对 windows 自动加 -buildmode exe 并嵌版本/图标资源
      - name: Cross-compile windows amd64
        run: go run bin/cross-compile.go "$FORK_VERSION" -include '^windows/amd64$' -tags noselfupdate
      - uses: actions/upload-artifact@v7
        with:
          name: rclone-windows
          if-no-files-found: error
          path: rclone-*.zip

  macos:
    name: darwin amd64+arm64 (CGO + macfuse)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # cmount 需要 macfuse 头文件（编译期）；用户机器上的运行期挂载同样需要安装 macfuse
      - name: Install macfuse + pandoc
        run: brew install --cask macfuse && brew install pandoc
      - name: Build docs
        run: make doc
      # 官方 build.yml 同款参数：一个 macOS runner 用 clang -arch 出双架构
      - name: Cross-compile darwin amd64
        run: go run bin/cross-compile.go "$FORK_VERSION" -include '^darwin/amd64' -cgo -tags 'cmount noselfupdate'
      - name: Cross-compile darwin arm64
        run: go run bin/cross-compile.go "$FORK_VERSION" -include '^darwin/arm64' -cgo -macos-arch arm64 -cgo-cflags=-I/usr/local/include -cgo-ldflags=-L/usr/local/lib -tags 'cmount noselfupdate'
      - uses: actions/upload-artifact@v7
        with:
          name: rclone-darwin
          if-no-files-found: error
          path: rclone-*.zip

  release:
    name: Publish release with SHA256SUMS
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/dbx-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rclone-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum rclone-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$FORK_VERSION" dist/rclone-*.zip dist/SHA256SUMS \
            --title "rclone $FORK_VERSION for DBX plugin" \
            --notes "dbx fork build. Asset naming and SHA256SUMS follow the official rclone convention; see dbx-plugin-files contrib/rclone-fork/README.md." \
            --verify-tag

  check-upstream:
    name: Check upstream rclone releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue when upstream publishes a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/rclone/rclone/releases/latest --jq .tag_name)"
          echo "upstream latest: $latest"
          if gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[].title' | grep -F "$latest"; then
            echo "issue for $latest already exists"
            exit 0
          fi
          gh issue create \
            --title "上游 rclone 已发布 $latest，请评估同步 dbx 分支" \
            --body "上游 [rclone $latest](https://github.com/rclone/rclone/releases/tag/$latest) 已发布。请按 contrib/rclone-fork/README.md 的上游同步流程 merge upstream/master，跑 quicktest 后打 dbx-<上游版本>-<序号> tag。" \
            --repo "$GITHUB_REPOSITORY"
