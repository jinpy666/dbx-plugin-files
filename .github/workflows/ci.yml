name: Files plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch/PR: superseded pushes cancel instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # aws-lc-sys (via opendal → reqwest → rustls) falls back to its bundled
  # prebuilt NASM objects when the assembler is missing on the MSVC toolchain;
  # harmless on every other OS.
  AWS_LC_SYS_PREBUILT_NASM: "1"
  # Windows runners default python stdout to cp1252; the smoke script prints
  # Unicode (→, ✓) and would die on UnicodeEncodeError. UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"
  # sccache caches rustc invocations. It matters because `dbx-plugin package`
  # rebuilds the sidecar from a staging copy with its own target dir
  # (verified: a full ~374-unit rebuild on every run, CARGO_TARGET_DIR is not
  # reused), so rust-cache's target-dir reuse cannot help that step —
  # sccache's content-keyed compilation cache can. Storage is a local dir
  # persisted via actions/cache: sccache's GitHub-Actions-cache backend
  # (SCCACHE_GHA_ENABLED) speaks the legacy artifactcache API and failed at
  # server startup against the decommissioning endpoint (HTTP 400 from the
  # Edge error page), which would turn every cache-service hiccup into a red
  # run; a local-dir startup never touches the network, so a restore miss
  # degrades to a cold build instead of a failure. Incremental must stay off
  # for sccache Rust hits.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python3 scripts/validate_repo.py
      - run: node scripts/connection-forms/verify.mjs files

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      # setup-node 的 pnpm 缓存需要 pnpm 已在 PATH 中，故置于 pnpm/action-setup 之后
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Committed ui/ output is fresh
        run: |
          if ! git diff --quiet -- ui/; then
            git diff --stat -- ui/
            echo "ui/ is stale: run 'pnpm --dir frontend build' and commit the output" >&2
            exit 1
          fi

  backend:
    name: Rust sidecar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        # No keyring/dbus in this dependency tree; nasm builds aws-lc-sys from
        # source on Linux (pkg-config covers its transitive build probes).
        run: sudo apt-get update && sudo apt-get install -y pkg-config nasm unzip
      - name: Install rclone (the sidecar spawns it for every engine op)
        # Pinned: fsinfo feature reporting shifts between minor versions and
        # the capabilities contract is asserted against 1.75.1 (dev machine).
        run: |
          curl -fsSL https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip -o /tmp/rclone.zip
          unzip -o -q /tmp/rclone.zip -d /tmp/rclone-tmp
          sudo mv /tmp/rclone-tmp/*/rclone /usr/local/bin/rclone
          rclone version | head -1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          # sccache is content-keyed, so an unchanged lock hash keeps the key
          # stable and new code just adds entries. The primary key carries the
          # job (and matrix target in the candidate job) so parallel saves
          # never collide; the restore prefix lets sibling jobs on the same
          # OS share compilations.
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.job }}-
            sccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo test --locked --manifest-path backend/Cargo.toml

  container-smoke:
    # Real-wire protocol coverage the unit tests cannot provide: MinIO (s3),
    # OpenSSH (sftp keyfile + sftp-native password), Samba (smb), Apache
    # mod_dav (webdav) and pyftpdlib (ftp) — the same faces the offline jobs
    # otherwise SKIP. All credentials are generated at run time.
    name: Containerized protocol smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [validate, backend]
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config nasm unzip
      - name: Install rclone (the sidecar spawns it for every engine op)
        # Pinned: fsinfo feature reporting shifts between minor versions and
        # the capabilities contract is asserted against 1.75.1 (dev machine).
        run: |
          curl -fsSL https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip -o /tmp/rclone.zip
          unzip -o -q /tmp/rclone.zip -d /tmp/rclone-tmp
          sudo mv /tmp/rclone-tmp/*/rclone /usr/local/bin/rclone
          rclone version | head -1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.job }}-
            sccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - name: Build release sidecar
        run: cargo build --locked --release --manifest-path backend/Cargo.toml
      - name: Protocol smoke against real containers
        env:
          DBX_PLUGIN_SIDECAR: ${{ github.workspace }}/backend/target/release/dbx-plugin-files
        run: scripts/container_smoke.sh
      - name: Proxy e2e (HTTP / SOCKS5 / SSH tunnel via rclone engine)
        env:
          DBX_PLUGIN_SIDECAR: ${{ github.workspace }}/backend/target/release/dbx-plugin-files
        run: |
          # 容器层自验证（含 gost 缺陷回归探针）+ 六场景 sidecar 驱动
          # （直连 / s3+HTTP 代理 / webdav+HTTP 代理 / sftp+SOCKS5 /
          #   s3+SSH 隧道 / 无代理 DNS 隔离负例）。
          scripts/proxy_e2e.sh --keep
          set -a; eval "$(scripts/proxy_e2e.sh --env-only)"; set +a
          python3 scripts/proxy_e2e.py

  candidate:
    name: Package candidate (${{ matrix.target }})
    # Runs in parallel with container-smoke (not after it): packaging is
    # validated independently by the offline MCP smoke below, and the run
    # still goes red if the protocol smoke fails — candidates-check waits
    # for both. Saves container-smoke's runtime from the critical path.
    needs: [validate, frontend, backend]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
            rclone_os: linux
            rclone_arch: amd64
            python: python3
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
            rclone_os: linux
            rclone_arch: arm64
            python: python3
          - os: macos
            runner: macos-15
            target: darwin-arm64
            rclone_os: darwin
            rclone_arch: arm64
            python: python3
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
            rclone_os: darwin
            rclone_arch: amd64
            python: python3
          - os: windows
            runner: windows-2022
            target: windows-x64
            rclone_os: windows
            rclone_arch: amd64
            python: python
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      SIDECAR_BINARY: backend/target/release/dbx-plugin-files${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nasm unzip
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          # Primary key carries matrix.target so the five parallel saves
          # never collide.
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-
            sccache-${{ runner.os }}-
      # rust-cache 的 key 自动包含 job 名与 matrix 值，五个 target 各自缓存；
      # 直接构建这一步靠它复用。`dbx-plugin package` 的 staging 副本构建
      # 不复用 target（见顶部 env 注释），改由 sccache 按编译单元提速。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: cargo build --locked --release --manifest-path backend/Cargo.toml
      # The backend job runs the test suite on Linux only; Windows-only
      # branches (the sftp quick-protocol refusal hint asserted by the
      # connection-form matrix) execute here on the real MSVC toolchain.
      - name: Windows test suite
        if: matrix.os == 'windows'
        run: cargo test --locked --manifest-path backend/Cargo.toml
      - name: Offline MCP smoke
        run: ${{ matrix.python }} scripts/smoke_mcp.py --binary "$SIDECAR_BINARY"
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - name: Fetch pinned rclone
        # Bundles rclone next to the sidecar via [package].include "bin";
        # the version pin and SHA256 live in scripts/fetch-rclone.sh.
        run: scripts/fetch-rclone.sh "${{ matrix.rclone_os }}" "${{ matrix.rclone_arch }}" "bin/${{ matrix.target }}"
      - name: Package .dbxp candidate
        # The CLI's staging build does NOT reuse backend/target (verified
        # locally: a full ~374-unit rebuild on every run regardless of
        # CARGO_TARGET_DIR); keep the env harmless and rely on sccache to
        # serve the cached compilations instead.
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/backend/target
          NO_COLOR: "1"
        run: dbx-plugin package .
      - name: Check bundled rclone in candidate
        run: ${{ matrix.python }} scripts/check_rclone_package.py dist/*.dbxp --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dbx-plugin-files-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  candidates-check:
    name: Cross-target candidate checks
    needs: [candidate, container-smoke]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dbx-plugin-files-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/check_candidates.py dist --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64
