[package]
name = "dbx-plugin-files"
version = "0.1.68"
edition = "2021"
license = "MIT"
description = "DBX files plugin sidecar: rclone-backed storage engine"

[workspace]

[dependencies]
base64 = "0.23"
dbx-plugin-sdk = "0.1.0"
# The rclone engine (managed `rclone rcd` + rc HTTP API) is the sole
# storage engine; the retired opendal/smb2/russh dependency set left with
# backend/src/engine/. No OpenDAL dependencies remain.


# `stream` gates `Part::file` (upload staging streams from disk).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "stream"] }
# reqwest powers the rc HTTP client (rclone engine) and the SSH tunnel
# health probes; chrono serves the rclone archive layer's mtime windows.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

# The DBX sidecar SDK is vendored under shared/ so a standalone checkout does
# not depend on the source monorepo or a sibling host checkout. See
# docs/REPOSITORY_SPLIT.zh-CN.md for the future public-package migration plan.
[patch.crates-io]
dbx-plugin-sdk = { path = "../shared/sdk/rust/dbx-plugin-sdk" }


[dev-dependencies]
tempfile = "3"
