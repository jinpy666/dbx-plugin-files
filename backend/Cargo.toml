[package]
name = "dbx-plugin-files"
version = "0.1.45"
edition = "2021"
license = "Apache-2.0"
description = "DBX files plugin sidecar: Apache OpenDAL storage engine"

[workspace]

[dependencies]
base64 = "0.22"
dbx-plugin-sdk = "0.1.0"
# opendal 0.58.x needs rustc >= 1.91 (edition 2024 workspace); the host
# toolchain is pinned to 1.88.0, so we lock the newest compatible line (0.57,
# MSRV 1.85). Re-evaluate on toolchain upgrades.
opendal = { version = "0.57", features = [
    "services-fs",
    "services-s3",
    "services-webdav",
    "services-ftp",
    "services-sftp",
    "services-gcs",
    "services-azblob",
    "services-oss",
    "services-obs",
    "services-cos",
    "services-memory",
] }
# Pure-Rust SMB2/3 client (F5-SMB): the OpenDAL service registry has no SMB
# backend, so `engine/smb/` adapts this crate behind a custom
# `opendal::raw::Access`. Exact pin — upgrades go through the SMB regression
# checklist (docs/IMPL_PLAN_SMB.zh-CN.md §0.2/§4).
smb2 = "=0.20.1"
# sftp-native（双栈决策 2026-08-31）：OpenDAL 0.57 的 sftp service 只支持
# keyfile 认证（无 password 配置项），密码型账号（企业 MFT 常态）接不进来。
# `engine/sftp_native/` 用 russh + russh-sftp（ssh 插件同款栈）自研
# `opendal::raw::Access` 适配器补位；OpenDAL sftp service 保留为 `sftp`
# 快捷协议，OpenDAL 后续支持密码认证时可整体切回。
# Version note (dual-stack decision 2026-08-31): the 0.60.x line pins
# aes-gcm `=0.11.0-rc.3` which cannot coexist with `smb2 =0.20.1` (same
# aes-gcm 0.11 series, stable `0.11.0` requirement) — cargo cannot hold both.
# 0.63.1 moved to stable pkcs5/pkcs8 (no rc chain) and MSRV 1.85 fits the
# pinned host toolchain; the ssh plugin stays on 0.60.3 (no smb2 there).
russh = "0.63.1"
russh-sftp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

# The SDK is consumed from the in-repo host/ submodule (t8y2/dbx); crates.io
# does not carry it. Override with [patch] in a local config when needed.
[patch.crates-io]
dbx-plugin-sdk = { path = "../../host/plugins/sdk/rust/dbx-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
